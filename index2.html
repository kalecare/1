<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Live Graph</title>

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 800px;
            text-align: center;
            border: 1px solid #334155;
        }

        h1 {
            color: #94a3b8;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .live-value {
            font-size: 3.5rem;
            font-weight: bold;
            color: #38bdf8;
            font-family: monospace;
            margin-bottom: 20px;
        }

        .chart-box {
            position: relative;
            height: 350px;
            width: 100%;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Live Python Data Stream (1–10)</h1>
    <div class="live-value" id="current-number">--</div>

    <div class="chart-box">
        <canvas id="liveChart"></canvas>
    </div>
</div>

<script>
    const currentNumElem = document.getElementById('current-number');
    const MAX_DATA_POINTS = 20; // Keep the last 20 readings on screen

    // --- Initialize Chart.js Line Chart ---
    const ctx = document.getElementById('liveChart').getContext('2d');
    const liveChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: [], // Time labels
            datasets: [{
                label: 'Random Value',
                data: [],
                borderColor: '#38bdf8',
                backgroundColor: 'rgba(56, 189, 248, 0.15)',
                borderWidth: 3,
                fill: true,
                tension: 0.3, // Curve smoothness
                pointRadius: 4,
                pointBackgroundColor: '#38bdf8'
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                x: {
                    grid: { color: '#334155' },
                    ticks: { color: '#94a3b8' }
                },
                y: {
                    min: 0,
                    max: 10,
                    grid: { color: '#334155' },
                    ticks: { color: '#94a3b8', stepSize: 1 }
                }
            },
            plugins: {
                legend: { display: false }
            }
        }
    });

    // --- Listen to Python SSE Stream ---
    const eventSource = new EventSource('/stream-data');

    eventSource.onmessage = function(event) {
        const newNumber = parseInt(event.data);
        const timeStamp = new Date().toLocaleTimeString();

        // 1. Update text display
        currentNumElem.innerText = newNumber;

        // 2. Add new data point to graph
        liveChart.data.labels.push(timeStamp);
        liveChart.data.datasets[0].data.push(newNumber);

        // 3. Keep sliding window of points
        if (liveChart.data.labels.length > MAX_DATA_POINTS) {
            liveChart.data.labels.shift();
            liveChart.data.datasets[0].data.shift();
        }

        // 4. Redraw Chart
        liveChart.update('none'); // Fast update without full animation
    };
</script>

</body>
</html>
